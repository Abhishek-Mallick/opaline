name: Feature request
description: Suggest an improvement to an existing component, the docs or the tooling.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or frustrating today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include API sketches if relevant.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
